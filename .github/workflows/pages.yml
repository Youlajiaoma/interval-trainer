name: Publish Interval Trainer PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set deployed build ID
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          build_id = os.environ['BUILD_COMMIT'][:7]
          path = Path('site/build-info.js')
          source = path.read_text(encoding='utf-8')
          marker = "build:'local'"
          if source.count(marker) != 1:
              raise SystemExit('Expected exactly one local build marker')
          path.write_text(source.replace(marker, f"build:'{build_id}'"), encoding='utf-8')
          PY
      - name: Bundle VexFlow for offline notation
        run: |
          mkdir -p site/vendor
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 \
            'https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js' \
            --output site/vendor/vexflow.js
          test "$(wc -c < site/vendor/vexflow.js)" -gt 100000
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
